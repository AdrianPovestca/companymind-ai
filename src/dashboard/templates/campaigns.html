<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · Campaigns</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafbfc;color:#1f2937}header{background:white;border-bottom:1px solid #e5e7eb;padding:24px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}.container{max-width:1200px;margin:0 auto;padding:0 24px}.header-top{display:flex;justify-content:space-between;align-items:center;gap:40px}h1{font-size:28px;font-weight:600}.nav{display:flex;gap:32px}.nav a{font-size:14px;color:#6b7280;font-weight:500;transition:.2s}.nav a:hover{color:#1f2937}.main{padding:48px 0}.tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:32px}.tab{padding:16px 0;font-size:14px;font-weight:600;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}.tab.active{color:#1f2937;border-bottom-color:#1f2937}.form-group{margin-bottom:24px}.label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#1f2937}.input,.textarea,.select{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:white;color:#1f2937;font-family:inherit}.input:focus,.textarea:focus,.select:focus{outline:0;border-color:#1f2937;box-shadow:0 0 0 3px rgba(31,41,55,.05)}.textarea{resize:vertical;min-height:120px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}.btn{border:0;padding:11px 20px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:.2s}.btn-primary{background:#1f2937;color:white}.btn-primary:hover{background:#111827}.btn-secondary{background:#f3f4f6;color:#1f2937;border:1px solid #e5e7eb}.btn-secondary:hover{background:#e5e7eb}.speed-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.speed-btn{padding:12px;border:1px solid #d1d5db;border-radius:8px;background:white;color:#1f2937;cursor:pointer;font-weight:600;transition:.2s}.speed-btn.selected{border-color:#1f2937;background:#f3f4f6}.recipient-list{background:white;border:1px solid #e5e7eb;border-radius:8px;max-height:250px;overflow-y:auto}.recipient-item{padding:12px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;font-size:13px}.recipient-item:last-child{border-bottom:0}.recipient-item button{border:0;background:#ef4444;color:white;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600}.campaign-card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:24px;margin-bottom:16px}.campaign-header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:20px}.campaign-title{font-size:16px;font-weight:600;color:#1f2937}.campaign-meta{font-size:13px;color:#9ca3af}.campaign-status{display:inline-block;font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;background:#f3f4f6;color:#1f2937}.campaign-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.stat-box{text-align:center;padding:12px}.stat-label{font-size:12px;color:#9ca3af;margin-bottom:4px}.stat-value{font-size:24px;font-weight:700;color:#1f2937}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}.modal.active{display:flex}.modal-content{background:white;border-radius:12px;padding:32px;max-width:600px;max-height:90vh;overflow-y:auto;width:90%}.modal-header{font-size:20px;font-weight:600;margin-bottom:24px}.modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:28px}.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px}.alert.success{background:#dcfce7;color:#166534}.alert.error{background:#fee2e2;color:#991b1b}.tab-content{display:none}.tab-content.active{display:block}@media(max-width:768px){.two-col{grid-template-columns:1fr}.speed-options{grid-template-columns:1fr}.campaign-stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><div class="container"><div class="header-top"><h1>Campaigns</h1><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/history">History</a></nav></div></div></header>

<main class="main"><div class="container">
<div class="tabs"><button class="tab active" onclick="switchTab('create')">Create</button><button class="tab" onclick="switchTab('list')">My Campaigns</button></div>

<div id="create-tab" class="tab-content active"><form onsubmit="handleCreateCampaign(event)"><div id="alert"></div><div class="form-group"><label class="label">Campaign Name</label><input type="text" class="input" id="name" required placeholder="Q4 Newsletter"></div><div class="two-col"><div class="form-group"><label class="label">From</label><input type="email" class="input" id="sender" required placeholder="your@email.com"></div><div class="form-group"><label class="label">Send Speed</label><div class="speed-options"><button type="button" class="speed-btn selected" onclick="setSpeed('slow')">Slow</button><button type="button" class="speed-btn" onclick="setSpeed('normal')">Normal</button><button type="button" class="speed-btn" onclick="setSpeed('fast')">Fast</button></div></div></div><div class="form-group"><label class="label">Subject</label><input type="text" class="input" id="subject" required placeholder="Hi [NAME]"><small style="color:#9ca3af;display:block;margin-top:6px">Use [NAME], [EMAIL] for personalization</small></div><div class="form-group"><label class="label">Message</label><textarea class="textarea" id="body" required placeholder="Your message..."></textarea></div><div class="form-group"><label class="label">Recipients</label><div class="two-col"><div><label class="label">Upload CSV</label><input type="file" id="csv" accept=".csv" onchange="handleCSV(event)" style="padding:10px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer"><small style="color:#9ca3af;display:block;margin-top:6px">Format: email,name</small></div><div><label class="label">Paste List</label><textarea class="textarea" id="paste" placeholder="one@email.com,Name&#10;two@email.com,Name2" style="height:100px"></textarea><button type="button" class="btn btn-secondary" onclick="addFromPaste()" style="width:100%;margin-top:8px">Add</button></div></div></div><div class="form-group"><label class="label">Recipients: <strong id="count">0</strong></label><div class="recipient-list" id="list"></div></div><div class="two-col"><button type="button" class="btn btn-secondary" onclick="scheduleClick()">Schedule</button><button type="submit" class="btn btn-primary">Send Now</button></div></form></div>

<div id="list-tab" class="tab-content"><div id="campaigns"></div></div>
</div></main>

<div id="preview-modal" class="modal"><div class="modal-content"><div class="modal-header">Preview</div><div style="margin:24px 0"><div class="form-group"><label class="label">Subject</label><div style="padding:12px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb;word-break:break-word" id="prev-subject"></div></div><div class="form-group"><label class="label">Message</label><div style="padding:12px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb;min-height:150px;white-space:pre-wrap;word-break:break-word" id="prev-body"></div></div><div class="form-group"><label class="label">To <strong id="prev-count"></strong> recipients</label></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closePreview()">Back</button><button class="btn btn-primary" onclick="confirmSend()">Send</button></div></div></div>

<script>
let recipients=[];let speed='slow';let pending=null;function switchTab(t){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById(t+'-tab').classList.add('active');event.target.classList.add('active');if(t==='list')loadCampaigns()}function setSpeed(s){speed=s;document.querySelectorAll('.speed-btn').forEach(e=>e.classList.remove('selected'));event.target.classList.add('selected')}function handleCSV(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{parseCSV(ev.target.result)};r.readAsText(f)}function addFromPaste(){const t=document.getElementById('paste').value;if(!t.trim())return;parseCSV(t);document.getElementById('paste').value=''}function parseCSV(t){const lines=t.trim().split('\n');const nr=[];lines.forEach(l=>{const [email,...name]=l.split(',');if(email.trim()){nr.push({email:email.trim(),name:name.join(',').trim()||''})}});recipients=[...new Map([...recipients,...nr].map(r=>[r.email,r])).values()];updateList()}function updateList(){const l=document.getElementById('list');document.getElementById('count').textContent=recipients.length;if(!recipients.length){l.innerHTML='<p style="color:#9ca3af;padding:20px;text-align:center">No recipients yet</p>';return}l.innerHTML=recipients.map((r,i)=>`<div class="recipient-item"><span>${r.email}${r.name?' • '+r.name:''}</span><button type="button" onclick="removeRecipient(${i})">Remove</button></div>`).join('')}function removeRecipient(i){recipients.splice(i,1);updateList()}function scheduleClick(){if(!recipients.length){showAlert('Please add recipients','error');return}document.getElementById('preview-modal').classList.add('active')}function closePreview(){document.getElementById('preview-modal').classList.remove('active')}async function handleCreateCampaign(e){e.preventDefault();const n=document.getElementById('name').value;const s=document.getElementById('subject').value;const b=document.getElementById('body').value;const se=document.getElementById('sender').value;if(!n||!s||!b||!se){showAlert('Fill all fields','error');return}if(!recipients.length){showAlert('Add recipients','error');return}pending={name:n,subject:s,body:b,sender_email:se,recipients,speed_setting:speed,scheduled_at:null};showPreview()}function showPreview(){const p=pending;document.getElementById('prev-subject').textContent=p.subject;let body=p.body.replace(/\[NAME\]/g,recipients[0]?.name||'there').replace(/\[EMAIL\]/g,recipients[0]?.email||'email@example.com');document.getElementById('prev-body').textContent=body;document.getElementById('prev-count').textContent=recipients.length;document.getElementById('preview-modal').classList.add('active')}async function confirmSend(){try{const r=await fetch('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});const d=await r.json();if(!d.ok){showAlert(d.error||'Failed','error');return}closePreview();showAlert('Campaign sent!','success');document.getElementById('name').value='';document.getElementById('subject').value='';document.getElementById('body').value='';recipients=[];updateList();setTimeout(()=>switchTab('list'),1000)}catch(e){showAlert('Error: '+e.message,'error')}}async function loadCampaigns(){try{const r=await fetch('/api/campaigns');const c=await r.json();const l=document.getElementById('campaigns');if(!c.length){l.innerHTML='<p style="color:#9ca3af">No campaigns yet</p>';return}l.innerHTML=c.map(x=>`<div class="campaign-card"><div class="campaign-header"><div><div class="campaign-title">${x.name}</div><div class="campaign-meta">${new Date(x.created_at).toLocaleDateString()}</div></div><span class="campaign-status">${x.status}</span></div><div class="campaign-stats"><div class="stat-box"><div class="stat-label">Total</div><div class="stat-value">${x.recipient_count}</div></div><div class="stat-box"><div class="stat-label">Sent</div><div class="stat-value">${x.sent||0}</div></div><div class="stat-box"><div class="stat-label">Failed</div><div class="stat-value">${x.failed||0}</div></div><div class="stat-box"><div class="stat-label">Pending</div><div class="stat-value">${x.pending||0}</div></div></div></div>`).join('')}catch(e){document.getElementById('campaigns').innerHTML='<p style="color:#ef4444">Error loading</p>'}}function showAlert(m,t){const a=document.getElementById('alert');a.innerHTML=`<div class="alert ${t}">${m}</div>`;if(t==='success')setTimeout(()=>a.innerHTML='',3000)}
</script>
</body></html>
