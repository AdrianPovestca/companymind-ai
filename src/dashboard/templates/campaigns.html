<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · Campaigns</title>
<style>
:root{--bg:#0b1220;--card:#121d31;--line:#243452;--text:#e8eef9;--muted:#91a2bd;--blue:#5b8cff;--green:#23c483;--red:#ff647c;--amber:#ffbd59}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#18294a,#0b1220 55%);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:34px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}h1{margin:0;font-size:31px}h1 span{color:var(--blue)}.nav a{color:var(--muted);text-decoration:none;margin-left:18px}.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line)}.tab{padding:16px 20px;color:var(--muted);cursor:pointer;border:0;background:0;font-weight:600;border-bottom:2px solid transparent;transition:.2s}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.tab-content{display:none}.tab-content.active{display:block}.form-group{margin-bottom:20px}.label{display:block;margin-bottom:8px;font-weight:600;font-size:14px}.input,.textarea,.select{width:100%;padding:12px;background:#16243c;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:14px}.textarea{resize:vertical;min-height:120px}.input:focus,.textarea:focus,.select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #5b8cff11}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btn{border:0;border-radius:8px;padding:12px 20px;color:white;font-weight:600;cursor:pointer;background:var(--blue);transition:.2s}.btn:hover{background:#6a97ff}.btn.secondary{background:#243452}.btn.danger{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.file-upload{position:relative;display:inline-block}.file-upload input[type=file]{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}.file-upload-label{display:block;padding:12px 20px;background:#16243c;border:2px dashed var(--line);border-radius:8px;text-align:center;cursor:pointer;transition:.2s}.file-upload-label:hover{border-color:var(--blue)}.recipient-list{background:#16243c;border:1px solid var(--line);border-radius:8px;padding:16px;max-height:300px;overflow-y:auto}.recipient-item{padding:8px;background:#0b1220;border-radius:6px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}.recipient-item button{border:0;background:var(--red);color:white;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px}.campaign-card{background:linear-gradient(145deg,#16243c,#101a2c);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.campaign-header{display:flex;justify-content:space-between;align-items:start;gap:20px}.campaign-title{font-size:16px;font-weight:600;margin-bottom:4px}.campaign-meta{color:var(--muted);font-size:12px}.campaign-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat-box{background:rgba(0,0,0,.2);padding:12px;border-radius:8px;text-align:center}.stat-label{color:var(--muted);font-size:11px}.stat-value{font-size:20px;font-weight:700;color:var(--blue)}.stat-value.sent{color:var(--green)}.stat-value.failed{color:var(--red)}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal.active{display:flex}.modal-content{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:600px;max-height:90vh;overflow-y:auto;width:90%}.modal-header{font-size:20px;font-weight:600;margin-bottom:20px}.modal-body{margin-bottom:24px}.modal-footer{display:flex;gap:12px;justify-content:flex-end}.alert{padding:12px;border-radius:8px;margin-bottom:16px}.alert.success{background:#23c48322;color:var(--green)}.alert.error{background:#ff647c22;color:var(--red)}.speed-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.speed-btn{padding:12px;border:2px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-weight:600;transition:.2s}.speed-btn.selected{border-color:var(--blue);background:#5b8cff22}@media(max-width:900px){.two-col{grid-template-columns:1fr}.campaign-stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap"><header class="top"><h1>PLATREMO <span>Campaigns</span></h1><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/history">History</a><a href="https://github.com/AdrianPovestca/companymind-ai">GitHub</a></nav></header>
<div class="tabs"><button class="tab active" onclick="switchCampaignTab('create')">Create Campaign</button><button class="tab" onclick="switchCampaignTab('list')">My Campaigns</button></div>
<div id="create-tab" class="tab-content active"><form onsubmit="handleCreateCampaign(event)"><div id="create-alert"></div><div class="form-group"><label class="label">Campaign Name</label><input type="text" class="input" id="campaign-name" required placeholder="e.g., September Newsletter"></div><div class="two-col"><div class="form-group"><label class="label">Sender Email</label><input type="email" class="input" id="sender-email" required placeholder="your-email@gmail.com"></div><div class="form-group"><label class="label">Send Speed</label><div class="speed-options"><button type="button" class="speed-btn selected" onclick="selectSpeed('slow')" data-speed="slow">Slow<br><small>Safe</small></button><button type="button" class="speed-btn" onclick="selectSpeed('normal')" data-speed="normal">Normal<br><small>Balanced</small></button><button type="button" class="speed-btn" onclick="selectSpeed('fast')" data-speed="fast">Fast<br><small>Quick</small></button></div><input type="hidden" id="speed-setting" value="slow"></div></div><div class="form-group"><label class="label">Email Subject</label><input type="text" class="input" id="email-subject" required placeholder="Use [NAME] for personalization"></div><div class="form-group"><label class="label">Email Body</label><textarea class="textarea" id="email-body" required placeholder="Write your message here. Use [NAME], [EMAIL] for personalization."></textarea><small style="color:var(--muted)">Use [NAME], [EMAIL], [COMPANY] etc. for personalization</small></div><div class="form-group"><label class="label">Recipients</label><div class="two-col"><div><label class="label">Upload CSV</label><div class="file-upload"><label class="file-upload-label">Click to upload CSV<input type="file" id="csv-file" accept=".csv" onchange="handleCSVUpload(event)"></label><small style="color:var(--muted);display:block;margin-top:8px">Format: email,name<br>example@test.com,John</small></div></div><div><label class="label">Paste Email List</label><textarea class="textarea" id="paste-emails" placeholder="One email per line or: email,name" style="height:100px"></textarea><button type="button" class="btn secondary" onclick="handlePasteEmails()">Add from Paste</button></div></div></div><div class="form-group"><label class="label">Recipients Added: <strong id="recipient-count">0</strong></label><div class="recipient-list" id="recipient-list"></div></div><div class="two-col"><button type="button" class="btn secondary" onclick="handleScheduleClick()">Schedule for Later</button><button type="submit" class="btn">Send Campaign Now</button></div><input type="hidden" id="scheduled-at"></form></div>
<div id="list-tab" class="tab-content"><div id="campaigns-list"></div></div></main>
<div id="preview-modal" class="modal"><div class="modal-content"><div class="modal-header">Campaign Preview</div><div class="modal-body"><div class="form-group"><label class="label">Subject</label><div style="background:#0b1220;padding:12px;border-radius:8px;border:1px solid var(--line);word-break:break-word" id="preview-subject"></div></div><div class="form-group"><label class="label">Body</label><div style="background:#0b1220;padding:12px;border-radius:8px;border:1px solid var(--line);min-height:200px;white-space:pre-wrap;word-break:break-word" id="preview-body"></div></div><div class="form-group"><label class="label">Recipients Count</label><div style="font-size:20px;font-weight:700;color:var(--blue)" id="preview-count"></div></div></div><div class="modal-footer"><button class="btn secondary" onclick="closePreviewModal()">Back</button><button class="btn" onclick="confirmSendCampaign()">Confirm & Send</button></div></div></div>
<div id="schedule-modal" class="modal"><div class="modal-content"><div class="modal-header">Schedule Campaign</div><div class="modal-body"><div class="form-group"><label class="label">Date</label><input type="date" class="input" id="schedule-date"></div><div class="form-group"><label class="label">Time</label><input type="time" class="input" id="schedule-time"></div><div class="form-group"><label class="label">Timezone</label><select class="select" id="schedule-timezone"><option value="UTC">UTC</option><option value="America/New_York">Eastern Time</option><option value="America/Chicago">Central Time</option><option value="America/Denver">Mountain Time</option><option value="America/Los_Angeles">Pacific Time</option><option value="Europe/London">London</option><option value="Europe/Paris">Paris</option><option value="Europe/Berlin">Berlin</option></select></div></div><div class="modal-footer"><button class="btn secondary" onclick="closeScheduleModal()">Cancel</button><button class="btn" onclick="confirmScheduleCampaign()">Schedule</button></div></div></div>
<script>
let currentRecipients=[];let selectedSpeed='slow';let pendingCampaignData=null;function switchCampaignTab(tab){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById(tab+'-tab').classList.add('active');event.target.classList.add('active');if(tab==='list')loadCampaigns()}function selectSpeed(speed){selectedSpeed=speed;document.getElementById('speed-setting').value=speed;document.querySelectorAll('.speed-btn').forEach(btn=>btn.classList.remove('selected'));event.target.closest('.speed-btn').classList.add('selected')}function handleCSVUpload(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const csv=e.target.result;parseCSV(csv)};reader.readAsText(file)}function handlePasteEmails(){const text=document.getElementById('paste-emails').value;if(!text.trim())return;parseCSV(text);document.getElementById('paste-emails').value=''}function parseCSV(text){const lines=text.trim().split('\n');const newRecipients=[];lines.forEach(line=>{const [email,...nameParts]=line.split(',');if(email.trim()){newRecipients.push({email:email.trim(),name:nameParts.join(',').trim()||''})}});currentRecipients=[...new Map([...currentRecipients,...newRecipients].map(r=>[r.email,r])).values()];updateRecipientDisplay();document.getElementById('paste-emails').value='';document.getElementById('csv-file').value=''}function updateRecipientDisplay(){const list=document.getElementById('recipient-list');document.getElementById('recipient-count').textContent=currentRecipients.length;if(currentRecipients.length===0){list.innerHTML='<p style="color:var(--muted)">No recipients added yet</p>';return}list.innerHTML=currentRecipients.map((r,i)=>`<div class="recipient-item"><span>${r.email}${r.name?' - '+r.name:''}</span><button type="button" onclick="removeRecipient(${i})">Remove</button></div>`).join('')}function removeRecipient(index){currentRecipients.splice(index,1);updateRecipientDisplay()}function handleScheduleClick(){if(currentRecipients.length===0){showAlert('create-alert','Please add recipients first','error');return}document.getElementById('schedule-modal').classList.add('active')}function closeScheduleModal(){document.getElementById('schedule-modal').classList.remove('active')}function closePreviewModal(){document.getElementById('preview-modal').classList.remove('active')}function confirmScheduleCampaign(){const date=document.getElementById('schedule-date').value;const time=document.getElementById('schedule-time').value;if(!date||!time){showAlert('create-alert','Please select date and time','error');return}const scheduledAt=new Date(`${date}T${time}`).toISOString();document.getElementById('scheduled-at').value=scheduledAt;closeScheduleModal();handleCreateCampaign({preventDefault:()=>{},target:{elements:Array.from(document.querySelectorAll('#create-tab input,#create-tab textarea')).reduce((obj,el)=>{obj[el.id]=el;return obj},{})}},scheduled:true)}async function handleCreateCampaign(e){e.preventDefault();const alert=document.getElementById('create-alert');if(currentRecipients.length===0){showAlert('create-alert','Please add at least one recipient','error');return}const name=document.getElementById('campaign-name').value;const subject=document.getElementById('email-subject').value;const body=document.getElementById('email-body').value;const senderEmail=document.getElementById('sender-email').value;const scheduled=document.getElementById('scheduled-at').value;if(!name||!subject||!body||!senderEmail){showAlert('create-alert','Please fill all fields','error');return}pendingCampaignData={name,subject,body,sender_email:senderEmail,recipients:currentRecipients,speed_setting:selectedSpeed,scheduled_at:scheduled||null};showPreviewModal()}function showPreviewModal(){const data=pendingCampaignData;document.getElementById('preview-subject').textContent=data.subject;const bodyPreview=data.body.replace(/\[NAME\]/g,currentRecipients[0]?.name||'John').replace(/\[EMAIL\]/g,currentRecipients[0]?.email||'email@example.com');document.getElementById('preview-body').textContent=bodyPreview;document.getElementById('preview-count').textContent=currentRecipients.length;document.getElementById('preview-modal').classList.add('active')}async function confirmSendCampaign(){const data=pendingCampaignData;try{const response=await fetch('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!result.ok){showAlert('create-alert',result.error||'Failed to create campaign','error');return}closePreviewModal();showAlert('create-alert','Campaign created! Sending in background...','success');document.getElementById('campaign-name').value='';document.getElementById('email-subject').value='';document.getElementById('email-body').value='';currentRecipients=[];updateRecipientDisplay();setTimeout(()=>switchCampaignTab('list'),1500)}catch(e){showAlert('create-alert','Error: '+e.message,'error')}}async function loadCampaigns(){try{const response=await fetch('/api/campaigns');const campaigns=await response.json();const list=document.getElementById('campaigns-list');if(!campaigns.length){list.innerHTML='<p style="color:var(--muted)">No campaigns yet</p>';return}list.innerHTML=campaigns.map(c=>`<div class="campaign-card"><div class="campaign-header"><div><div class="campaign-title">${c.name}</div><div class="campaign-meta">Created: ${new Date(c.created_at).toLocaleDateString()}</div></div><div style="text-align:right"><span style="background:#5b8cff22;color:var(--blue);padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px">${c.status}</span></div></div><div class="campaign-stats"><div class="stat-box"><div class="stat-label">Total</div><div class="stat-value">${c.recipient_count}</div></div><div class="stat-box"><div class="stat-label">Sent</div><div class="stat-value sent">${c.sent||0}</div></div><div class="stat-box"><div class="stat-label">Failed</div><div class="stat-value failed">${c.failed||0}</div></div><div class="stat-box"><div class="stat-label">Pending</div><div class="stat-value">${c.pending||0}</div></div></div><div style="margin-top:16px;color:var(--muted);font-size:13px"><strong>Subject:</strong> ${c.subject}<br><strong>Speed:</strong> ${c.speed_setting}</div></div>`).join('')}catch(e){document.getElementById('campaigns-list').innerHTML='<p style="color:var(--red)">Error loading campaigns</p>'}}function showAlert(elementId,message,type){const el=document.getElementById(elementId);el.innerHTML=`<div class="alert ${type}">${message}</div>`;if(type==='success'){setTimeout(()=>el.innerHTML='',3000)}}
</script></body></html>
