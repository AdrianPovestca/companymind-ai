<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · Email History</title>
<style>
:root{--bg:#0b1220;--card:#121d31;--line:#243452;--text:#e8eef9;--muted:#91a2bd;--blue:#5b8cff;--green:#23c483;--red:#ff647c;--amber:#ffbd59}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#18294a,#0b1220 55%);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:34px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}h1{margin:0;font-size:31px}h1 span{color:var(--blue)}.nav a{color:var(--muted);text-decoration:none;margin-left:18px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:34px}.stat-card{background:linear-gradient(145deg,#16243c,#101a2c);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}.stat-label{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:8px}.stat-num{font-size:32px;font-weight:750;color:var(--blue)}.stat-num.person{color:var(--green)}.stat-num.urgent{color:var(--red)}.stat-num.spam{color:var(--amber)}.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line)}.tab{padding:16px 20px;color:var(--muted);cursor:pointer;border:0;background:0;font-weight:600;border-bottom:2px solid transparent;transition:.2s}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.table{width:100%;background:linear-gradient(145deg,#16243c,#101a2c);border:1px solid var(--line);border-radius:16px;overflow:hidden}.table-header{display:grid;grid-template-columns:120px 1fr 200px 150px;gap:16px;padding:16px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--line);font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.table-row{display:grid;grid-template-columns:120px 1fr 200px 150px;gap:16px;padding:16px;border-bottom:1px solid var(--line);align-items:center}.table-row:hover{background:rgba(91,140,255,.05)}.table-cell{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-cell-subject{white-space:normal}.category-tag{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase}.category-person{background:#23c48322;color:var(--green)}.category-urgent{background:#ff647c22;color:var(--red)}.category-marketing{background:#5b8cff22;color:var(--blue)}.category-spam{background:#ffbd5922;color:var(--amber)}.category-promotion{background:#6366f122;color:#a78bfa}.category-normal{background:#91a2bd22;color:var(--muted)}.loading{text-align:center;color:var(--muted);padding:40px;font-size:14px}.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}@media(max-width:900px){.table-header,.table-row{grid-template-columns:100px 1fr 100px}.table-cell{font-size:12px}}
</style></head>
<body><main class="wrap"><header class="top"><h1>PLATREMO <span>Email History</span></h1><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/review">Review Queue</a><a href="https://github.com/AdrianPovestca/companymind-ai">GitHub</a></nav></header>
<section class="stats-grid" id="stats-container"></section>
<div class="tabs"><button class="tab active" onclick="switchTab('all')">All Emails</button><button class="tab" onclick="switchTab('spam')">Spam Folder</button></div>
<section id="all-tab" class="tab-content"><table class="table"><div class="table-header"><div>Date</div><div>Sender</div><div>Subject</div><div>Category</div></div><div id="history-list" class="table-body"></div></table></section>
<section id="spam-tab" class="tab-content" style="display:none"><table class="table"><div class="table-header"><div>Date</div><div>Sender</div><div>Subject</div><div>Status</div></div><div id="spam-list" class="table-body"></div></table></section></main>
<script>
function switchTab(tab){document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none');document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById(tab+'-tab').style.display='block';document.event.target.classList.add('active');if(tab==='all')loadHistory();else loadSpam()}
async function loadStats(){try{const stats=await fetch('/api/history-stats').then(r=>r.json());const html=`<div class="stat-card"><div class="stat-label">Total</div><div class="stat-num">${stats.total||0}</div></div><div class="stat-card"><div class="stat-label">Person</div><div class="stat-num person">${stats.person||0}</div></div><div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-num urgent">${stats.urgent||0}</div></div><div class="stat-card"><div class="stat-label">Marketing</div><div class="stat-num">${stats.marketing||0}</div></div><div class="stat-card"><div class="stat-label">Promotion</div><div class="stat-num">${stats.promotion||0}</div></div><div class="stat-card"><div class="stat-label">Spam</div><div class="stat-num spam">${stats.spam||0}</div></div><div class="stat-card"><div class="stat-label">Normal</div><div class="stat-num">${stats.normal||0}</div></div>`;document.getElementById('stats-container').innerHTML=html}catch(e){console.error(e)}}
async function loadHistory(){try{const emails=await fetch('/api/email-history').then(r=>r.json());const list=document.getElementById('history-list');if(!emails.length){list.innerHTML='<div class="empty">No emails found</div>';return}list.innerHTML=emails.map(e=>`<div class="table-row"><div class="table-cell">${new Date(e.created_at).toLocaleDateString()}</div><div class="table-cell">${e.sender}</div><div class="table-cell table-cell-subject">${e.subject}</div><div class="table-cell"><span class="category-tag category-${e.email_category}">${e.email_category}</span></div></div>`).join('')}catch(e){console.error(e);document.getElementById('history-list').innerHTML='<div class="empty">Error loading emails</div>'}}
async function loadSpam(){try{const emails=await fetch('/api/spam-emails').then(r=>r.json());const list=document.getElementById('spam-list');if(!emails.length){list.innerHTML='<div class="empty">No spam emails</div>';return}list.innerHTML=emails.map(e=>`<div class="table-row"><div class="table-cell">${new Date(e.created_at).toLocaleDateString()}</div><div class="table-cell">${e.sender}</div><div class="table-cell table-cell-subject">${e.subject}</div><div class="table-cell"><span class="category-tag category-spam">Suspected Spam</span></div></div>`).join('')}catch(e){console.error(e);document.getElementById('spam-list').innerHTML='<div class="empty">Error loading spam</div>'}}
document.addEventListener('DOMContentLoaded',()=>{loadStats();loadHistory();document.querySelectorAll('.tab').forEach((tab,i)=>{tab.onclick=()=>{switchTab(i===0?'all':'spam')}})});
</script></body></html>
