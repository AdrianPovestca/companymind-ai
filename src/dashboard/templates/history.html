<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · History</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafbfc;color:#1f2937}header{background:white;border-bottom:1px solid #e5e7eb;padding:24px 0}.container{max-width:1200px;margin:0 auto;padding:0 24px}.header-top{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;font-weight:600}.nav{display:flex;gap:32px}.nav a{font-size:14px;color:#6b7280;font-weight:500}.main{padding:48px 0}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:40px}.stat{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:20px;text-align:center}.stat-label{font-size:12px;color:#9ca3af;font-weight:600;margin-bottom:8px}.stat-value{font-size:28px;font-weight:700;color:#1f2937}.tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:32px}.tab{padding:16px 0;font-size:14px;font-weight:600;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}.tab.active{color:#1f2937;border-bottom-color:#1f2937}.table{width:100%;background:white;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}.table-head{display:grid;grid-template-columns:110px 1fr 250px 120px;gap:16px;padding:16px 20px;background:#f9fafb;border-bottom:1px solid #e5e7eb;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase}.table-row{display:grid;grid-template-columns:110px 1fr 250px 120px;gap:16px;padding:16px 20px;border-bottom:1px solid #f3f4f6;align-items:center}.table-row:hover{background:#fafbfc}.table-row:last-child{border-bottom:0}.tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}.tag-person{background:#dcfce7;color:#166534}.tag-urgent{background:#fee2e2;color:#991b1b}.tag-marketing{background:#dbeafe;color:#1e40af}.tag-spam{background:#fed7aa;color:#b45309}.tag-normal{background:#f3f4f6;color:#6b7280}.empty{text-align:center;padding:40px;color:#9ca3af}@media(max-width:768px){.table-head,.table-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><div class="container"><div class="header-top"><h1>Email History</h1><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/campaigns">Campaigns</a></nav></div></div></header>

<main class="main"><div class="container">
<div class="stats-grid" id="stats"></div>
<div class="tabs"><button class="tab active" onclick="switchTab('all')">All Emails</button><button class="tab" onclick="switchTab('spam')">Spam</button></div>
<div id="all-tab" class="tab-content active"><div class="table"><div class="table-head"><div>Date</div><div>From</div><div>Subject</div><div>Category</div></div><div id="all-list"></div></div></div>
<div id="spam-tab" class="tab-content" style="display:none"><div class="table"><div class="table-head"><div>Date</div><div>From</div><div>Subject</div><div>Status</div></div><div id="spam-list"></div></div></div>
</div></main>

<script>
async function loadStats(){try{const r=await fetch('/api/history-stats');const s=await r.json();const h=document.getElementById('stats');h.innerHTML=Object.entries(s).filter(([k])=>k!=='total').map(([k,v])=>`<div class="stat"><div class="stat-label">${k}</div><div class="stat-value">${v}</div></div>`).join('')}catch(e){}}async function loadAll(){try{const r=await fetch('/api/email-history');const e=await r.json();const l=document.getElementById('all-list');if(!e.length){l.innerHTML='<div class="empty">No emails</div>';return}l.innerHTML=e.map(x=>`<div class="table-row"><div>${new Date(x.created_at).toLocaleDateString()}</div><div style="font-size:13px">${x.sender}</div><div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.subject}</div><div><span class="tag tag-${x.email_category}">${x.email_category}</span></div></div>`).join('')}catch(e){document.getElementById('all-list').innerHTML='<div class="empty">Error</div>'}}async function loadSpam(){try{const r=await fetch('/api/spam-emails');const e=await r.json();const l=document.getElementById('spam-list');if(!e.length){l.innerHTML='<div class="empty">No spam</div>';return}l.innerHTML=e.map(x=>`<div class="table-row"><div>${new Date(x.created_at).toLocaleDateString()}</div><div style="font-size:13px">${x.sender}</div><div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.subject}</div><div><span class="tag tag-spam">Spam</span></div></div>`).join('')}catch(e){document.getElementById('spam-list').innerHTML='<div class="empty">Error</div>'}}function switchTab(t){document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none');document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById(t+'-tab').style.display='block';event.target.classList.add('active');if(t==='spam')loadSpam();else loadAll()}loadStats();loadAll();
</script>
</body></html>
