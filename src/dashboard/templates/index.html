<!DOCTYPE html>
<html>
<head>
    <title>Email Agent Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
        h1 { font-size: 42px; font-weight: 700; color: #d4a574; }
        .nav { display: flex; gap: 20px; }
        .nav a { color: #d4a574; text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 4px; transition: 0.2s; }
        .nav a:hover { background: rgba(212, 165, 116, 0.1); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 50px 0; }
        .stat-card { background: linear-gradient(135deg, #1a2332 0%, #16213e 100%); padding: 40px; border-radius: 12px; border: 1px solid rgba(212, 165, 116, 0.2); transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(212, 165, 116, 0.5); box-shadow: 0 20px 40px rgba(212, 165, 116, 0.1); }
        .stat-number { font-size: 56px; font-weight: 700; color: #d4a574; line-height: 1; margin-bottom: 15px; }
        .stat-label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .action-section { text-align: center; margin: 80px 0; }
        .button { display: inline-block; padding: 18px 50px; background: linear-gradient(135deg, #d4a574 0%, #a67c52 100%); color: #0f1419; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; border: none; transition: 0.3s; box-shadow: 0 10px 30px rgba(212, 165, 116, 0.2); margin: 10px; }
        .button:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(212, 165, 116, 0.3); }
        .button.danger { background: linear-gradient(135deg, #9d1f44 0%, #7a1635 100%); }
        .status { margin-top: 30px; padding: 20px; background: rgba(212, 165, 116, 0.1); border-radius: 8px; color: #d4a574; display: none; border-left: 3px solid #d4a574; }
        .status.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 PLATREMO Email Agent</h1>
            <div class="nav">
                <a href="/">Intro</a>
                <a href="/review">Review Queue</a>
                <a href="https://github.com/AdrianPovestca/companymind-ai" target="_blank">GitHub</a>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pending">0</div>
                <div class="stat-label">Pending Review</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="auto">0</div>
                <div class="stat-label">Auto-Replied</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total">0</div>
                <div class="stat-label">Total Processed</div>
            </div>
        </div>

        <div class="action-section">
            <button class="button" id="btn" onclick="process()">▶ Start Processing</button>
            <button class="button danger" onclick="alert('Scheduler runs 24/7 on Railway')">⏹ Stop</button>
            <a href="/review" class="button">👁 Review Queue</a>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        function process() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.textContent = '⏳ Processing...';
            status.className = 'status show';
            status.textContent = 'Processing emails...';
            fetch('/api/process-emails', {method: 'POST'})
                .then(r => r.json())
                .then(d => {
                    status.textContent = '✅ Done!';
                    setTimeout(() => {
                        btn.textContent = '▶ Start Processing';
                        btn.disabled = false;
                        loadStats();
                        setTimeout(() => status.className = 'status', 2000);
                    }, 1500);
                })
                .catch(e => {
                    status.textContent = '❌ Error';
                    btn.disabled = false;
                    btn.textContent = '▶ Start Processing';
                });
        }
        function loadStats() {
            fetch('/api/stats').then(r => r.json()).then(d => {
                document.getElementById('pending').textContent = d.pending;
                document.getElementById('auto').textContent = d.auto_replied;
                document.getElementById('total').textContent = d.total;
            });
        }
        loadStats();
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
