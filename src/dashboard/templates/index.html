<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · Email Agent</title>
<style>
:root{--bg:#0b1220;--card:#121d31;--line:#243452;--text:#e8eef9;--muted:#91a2bd;--blue:#5b8cff;--green:#23c483;--red:#ff647c;--amber:#ffbd59}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#18294a,#0b1220 55%);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}h1{margin:0;font-size:31px}h1 span{color:var(--blue)}.nav a{color:var(--muted);text-decoration:none;margin-left:18px}.statusbar{display:flex;align-items:center;gap:12px;background:rgba(18,29,49,.86);border:1px solid var(--line);border-radius:16px;padding:17px 20px;margin-bottom:24px}.dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #ff647c22}.dot.on{background:var(--green);box-shadow:0 0 0 5px #23c48322}.statusbar strong{font-size:17px}.statusbar small{color:var(--muted);margin-left:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(145deg,#16243c,#101a2c);border:1px solid var(--line);border-radius:16px;padding:22px}.num{font-size:36px;font-weight:750;margin:10px 0 4px}.label{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.btn{border:0;border-radius:11px;padding:13px 20px;color:white;font-weight:700;cursor:pointer;background:var(--blue);box-shadow:0 8px 20px #5b8cff2a}.btn.stop{background:#7b2840}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{min-height:24px;color:var(--muted);margin:8px 0}.panel{margin-top:24px}.panel h2{font-size:18px}.email{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.email b{display:block}.email span{color:var(--muted);font-size:13px}.urgent{color:var(--amber)}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.nav a{margin:0 14px 0 0}.stats{grid-template-columns:repeat(2,1fr)}.email{display:block}}
</style></head>
<body><main class="wrap"><header class="top"><h1>PLATREMO <span>Email Agent</span></h1><nav class="nav"><a href="/intro">Intro</a><a href="/review">Review Queue</a><a href="/history">History</a><a href="/campaigns">Campaigns</a><a href="https://github.com/AdrianPovestca/companymind-ai">GitHub</a></nav></header>
<section class="statusbar"><i class="dot" id="dot"></i><strong id="agent-status">Stopped</strong><small id="last-run"></small></section>
<section class="stats"><div class="card"><div class="label">Pending</div><div class="num" id="pending">0</div></div><div class="card"><div class="label">Auto-replies</div><div class="num" id="auto">0</div></div><div class="card"><div class="label">Processed</div><div class="num" id="total">0</div></div><div class="card"><div class="label urgent">Urgent</div><div class="num urgent" id="urgent">0</div></div></section>
<div class="actions"><button class="btn" id="start" onclick="startAgent()">Start Agent</button><button class="btn stop" id="stop" onclick="stopAgent()">Stop Agent</button><a class="btn" href="/review">Review Queue</a></div><div class="notice" id="notice">Agent is stopped.</div>
<section class="panel"><h2>Emails requiring attention</h2><div id="emails"><div class="card">Loading...</div></div></section></main>
<script>
const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);return r.json()}
async function refresh(){try{const [s,a,e]=await Promise.all([api('/api/agent/status'),api('/api/stats'),api('/api/pending-emails')]);$('agent-status').textContent=s.status;$('dot').classList.toggle('on',s.running);$('last-run').textContent=s.last_run?'Last run: '+s.last_run:'';$('start').disabled=s.running;$('stop').disabled=!s.running;$('pending').textContent=a.pending;$('auto').textContent=a.auto_replied;$('total').textContent=a.total;$('urgent').textContent=a.urgent;if(s.last_error)$('notice').textContent='Error: '+s.last_error;$('emails').innerHTML=e.length?e.map(x=>`<div class="email"><div><b>${escapeHtml(x.subject||'(no subject)')}</b><span>${escapeHtml(x.sender||'')}</span></div><span class="urgent">Attention required</span></div>`).join(''):'<div class="card">No urgent or review-required emails.</div>'}catch(err){$('notice').textContent='Dashboard unavailable: '+err}}
function escapeHtml(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function startAgent(){ $('notice').textContent='Starting agent...';await api('/api/agent/start',{method:'POST'});refresh()}async function stopAgent(){ $('notice').textContent='Stopping...';await api('/api/agent/stop',{method:'POST'});refresh()}refresh();setInterval(refresh,4000);
</script></body></html>
