<!DOCTYPE html>
<html>
<head>
    <title>Email Agent Dashboard</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0f3460; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card { background: #16213e; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 36px; color: #00d4ff; font-weight: bold; }
        .stat-label { color: #888; font-size: 14px; }
        .button { background: #00d4ff; color: black; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .button:hover { background: #00a8cc; }
        .button:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Agent Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="pending">0</div>
                <div class="stat-label">PENDING</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="auto">0</div>
                <div class="stat-label">AUTO-REPLIED</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total">0</div>
                <div class="stat-label">TOTAL</div>
            </div>
        </div>
        
        <div style="text-align: center; margin: 40px 0;">
            <button class="button" id="btn" onclick="process()">START AUTO-PROCESSING</button>
        </div>
    </div>
    <script>
        function process() {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            fetch('/api/process-emails', {method: 'POST'}).then(r => r.json()).then(d => {
                btn.textContent = 'DONE!';
                setTimeout(() => { btn.textContent = 'START AUTO-PROCESSING'; btn.disabled = false; }, 2000);
            });
        }
        fetch('/api/stats').then(r => r.json()).then(d => {
            document.getElementById('pending').textContent = d.pending;
            document.getElementById('auto').textContent = d.auto_replied;
            document.getElementById('total').textContent = d.total;
        });
    </script>
</body>
</html>
