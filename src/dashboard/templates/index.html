<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATREMO · Email Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:#ffffff;color:#1a1a1a;line-height:1.6}a{color:inherit;text-decoration:none}.container{max-width:1400px;margin:0 auto;padding:0 24px}header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:white;padding:40px 0;border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.1)}.header-content{display:flex;justify-content:space-between;align-items:center;gap:40px}.logo{font-size:28px;font-weight:700;letter-spacing:-1px}h1{font-size:32px;font-weight:600}h1 span{color:#00d4ff;font-weight:700}.nav{display:flex;gap:32px;align-items:center}.nav a{font-size:14px;font-weight:500;opacity:.8;transition:.3s;padding:8px 16px;border-radius:8px}.nav a:hover{opacity:1;background:rgba(255,255,255,.1)}.nav-btns{display:flex;gap:16px}.btn{border:0;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;transition:.3s;font-size:14px}.btn-primary{background:linear-gradient(135deg,#00d4ff 0%,#0099cc 100%);color:white;box-shadow:0 8px 24px rgba(0,212,255,.2)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,212,255,.3)}.btn-danger{background:#ff4757;color:white}.btn-danger:hover{background:#ff3838}.main{padding:60px 0}.status-banner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#f0f4ff 0%,#e8f0ff 100%);border:1px solid #d0e0ff;border-radius:16px;padding:20px 24px;margin-bottom:40px;box-shadow:0 4px 12px rgba(0,0,0,.05)}.status-dot{width:12px;height:12px;border-radius:50%;background:#ff6b6b;animation:pulse 2s infinite}.status-dot.active{background:#51cf66;animation:none}.status-text{flex:1;font-size:16px;font-weight:500}.status-time{font-size:13px;color:#666;font-weight:400}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-bottom:60px}.stat-card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.3s}.stat-card:hover{box-shadow:0 12px 28px rgba(0,0,0,.08);border-color:#d0e0ff}.stat-label{font-size:12px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}.stat-value{font-size:44px;font-weight:700;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.stat-value.urgent{background:linear-gradient(135deg,#ff6b6b 0%,#ff4757 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.actions{display:flex;gap:16px;margin-bottom:60px;flex-wrap:wrap}.section{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:40px}.section h2{font-size:22px;font-weight:600;margin-bottom:28px;color:#1a1a2e}.section-notice{background:#fff9e6;border-left:4px solid #ffd666;padding:16px;border-radius:8px;margin-bottom:24px;font-size:14px;color:#666}.email-item{padding:16px 0;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:start;gap:16px}.email-item:last-child{border-bottom:0}.email-info{flex:1}.email-subject{font-weight:600;color:#1a1a2e;margin-bottom:4px;font-size:15px}.email-sender{font-size:13px;color:#999}.email-tag{display:inline-block;background:#fff3cd;color:#856404;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;margin-top:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}@media(max-width:768px){header{padding:24px 0}.header-content{flex-direction:column;gap:24px;text-align:center}.nav{flex-direction:column;gap:16px}.stats-grid{grid-template-columns:1fr}.main{padding:40px 0}}
</style></head>
<body>
<header><div class="container"><div class="header-content"><div><div class="logo">PLATREMO</div></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/intro">Intro</a><a href="/history">History</a><a href="/campaigns">Campaigns</a><a href="https://github.com/AdrianPovestca/companymind-ai" target="_blank">GitHub</a></nav><div class="nav-btns"><a href="/campaigns" class="btn btn-primary">New Campaign</a></div></div></div></header>

<main class="main"><div class="container">
<div class="status-banner"><span class="status-dot" id="dot"></span><div class="status-text"><strong id="agent-status">Stopped</strong> · Email Agent Status</div><div class="status-time" id="last-run">Ready to start</div></div>

<div class="stats-grid"><div class="stat-card"><div class="stat-label">Pending Emails</div><div class="stat-value" id="pending">0</div></div><div class="stat-card"><div class="stat-label">Auto Replies</div><div class="stat-value" id="auto">0</div></div><div class="stat-card"><div class="stat-label">Processed</div><div class="stat-value" id="total">0</div></div><div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-value urgent" id="urgent">0</div></div></div>

<div class="actions"><button class="btn btn-primary" id="start" onclick="startAgent()">Start Agent</button><button class="btn btn-danger" id="stop" onclick="stopAgent()">Stop Agent</button><a href="/review" class="btn" style="background:#e8e8e8;color:#1a1a2e">Review Queue</a></div>

<div class="section"><h2>Emails Requiring Attention</h2><div class="section-notice" id="notice">Agent is stopped. Start it to begin processing emails.</div><div id="emails"><p style="color:#999;text-align:center;padding:40px">No pending emails</p></div></div>

</div></main>

<script>
const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);return r.json()}
async function refresh(){try{const [s,a,e]=await Promise.all([api('/api/agent/status'),api('/api/stats'),api('/api/pending-emails')]);$('agent-status').textContent=s.status;const dot=$('dot');dot.classList.toggle('active',s.running);dot.style.background=s.running?'#51cf66':'#ff6b6b';$('last-run').textContent=s.last_run?'Last run: '+s.last_run:'Ready to start';$('start').disabled=s.running;$('stop').disabled=!s.running;$('pending').textContent=a.pending;$('auto').textContent=a.auto_replied;$('total').textContent=a.total;$('urgent').textContent=a.urgent;if(s.last_error){$('notice').textContent='Error: '+s.last_error;$('notice').style.background='#ffe5e5';$('notice').style.borderColor='#ff6b6b';$('notice').style.color='#c41e3a'}else{$('notice').textContent='Agent running. Processing emails...';$('notice').style.background='#e5f9e5';$('notice').style.borderColor='#51cf66';$('notice').style.color='#2b6b2b'}const emailsHtml=e.length?e.map(x=>`<div class="email-item"><div class="email-info"><div class="email-subject">${escapeHtml(x.subject||'(no subject)')}</div><div class="email-sender">From: ${escapeHtml(x.sender||'')}</div><span class="email-tag">Needs Review</span></div></div>`).join(''):'<p style="color:#999;text-align:center;padding:40px">No urgent or review-required emails.</p>';$('emails').innerHTML=emailsHtml}catch(err){$('notice').textContent='Connection error: '+err;$('notice').style.background='#ffe5e5'}}
function escapeHtml(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function startAgent(){$('notice').textContent='Starting agent...';const r=await api('/api/agent/start',{method:'POST'});if(!r.ok){$('notice').textContent='Error: '+r.error}refresh()}
async function stopAgent(){$('notice').textContent='Stopping agent...';await api('/api/agent/stop',{method:'POST'});refresh()}
refresh();setInterval(refresh,4000)
</script>
</body></html>
